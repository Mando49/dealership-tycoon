<meta charset="utf-8">
<title>Dealership Tycoon</title>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Saira+Condensed:wght@600;800&family=Barlow:wght@400;600;700&display=swap">
<style>
/* Layout: one screen. HUD strip on top, the showroom photo as a wide stage, a context panel under it. Single dusk look by choice. */
:root{
  --night:#12151c; --panel:#1b2029; --line:#2c3340; --text:#eef1f5; --dim:#97a1b0;
  --brand:#d4343a; --gold:#e9b949; --good:#4cc38a; --bad:#e5484d;
  --display:"Saira Condensed","Arial Narrow",Impact,sans-serif;
  --body:"Barlow",system-ui,sans-serif;
  color-scheme:dark;
}
html,body{height:100%}
[hidden]{display:none!important}
body{margin:0;background:var(--night);color:var(--text);font-family:var(--body);-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;overflow:hidden}
.app{height:100%;display:flex;flex-direction:column;gap:8px;padding-inline:16px;padding-block:8px;box-sizing:border-box;max-width:1280px;margin:0 auto}
.hud{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.brand{font-family:var(--display);font-weight:800;font-size:22px;letter-spacing:.06em;white-space:nowrap}
.brand b{color:var(--brand)}
.stat{display:flex;flex-direction:column;line-height:1.1}
.stat small{font-size:10px;letter-spacing:.14em;color:var(--dim);text-transform:uppercase}
.stat span{font-family:var(--display);font-weight:800;font-size:20px;font-variant-numeric:tabular-nums}
.money span{color:var(--good)}
.stars span{color:var(--gold)}
.clock{flex:1;min-width:110px}
.bar{height:6px;border-radius:3px;background:var(--line);overflow:hidden;margin-top:4px}
.bar i{display:block;height:100%;background:linear-gradient(90deg,#f0a35e,var(--brand));width:0}
.hudbtns{display:flex;gap:8px}
button{font:inherit;cursor:pointer;border:0;color:inherit}
.btn{background:var(--panel);border:1px solid var(--line);padding:8px 12px;border-radius:8px;font-weight:700;font-size:14px}
.btn.red{background:var(--brand);border-color:var(--brand);color:#fff}
.btn:disabled{opacity:.4;cursor:default}
.btn:focus-visible,.pick:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.stage{position:relative;flex:1;min-height:0;display:flex;align-items:center;justify-content:center}
svg.scene{width:100%;height:100%;max-height:100%;display:block;border-radius:10px;background:#2a2622}
.person{cursor:pointer}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px 12px;min-height:84px;box-sizing:border-box}
.panel h3{margin:0 0 6px;font-family:var(--display);font-weight:800;font-size:18px;letter-spacing:.04em}
.panel p{margin:0;color:var(--dim);font-size:14px}
.cards{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px}
.card{flex:0 0 auto;background:#232a35;border:1px solid var(--line);border-radius:8px;padding:8px 10px;text-align:left;min-width:132px}
.card b{display:block;font-size:14px}
.card em{font-style:normal;font-size:12px;color:var(--dim)}
.card .p{font-family:var(--display);font-weight:800;font-size:18px;color:var(--good)}
.card.match{border-color:var(--good)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}

.modal{background:rgba(27,32,41,.94);border:1px solid var(--line);border-radius:14px;padding:20px;max-width:680px;width:100%;max-height:100%;overflow:auto;box-sizing:border-box;backdrop-filter:blur(6px)}
.modal h2{margin:0 0 4px;font-family:var(--display);font-weight:800;font-size:30px;letter-spacing:.04em}
.modal h4{margin:12px 0 8px;font-size:13px;letter-spacing:.14em;text-transform:uppercase;color:var(--dim)}
.modal .sub{color:var(--dim);margin:0 0 10px}
.sum{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:14px}
.sum div{background:#232a35;border-radius:8px;padding:8px}
.sum small{display:block;font-size:10px;letter-spacing:.12em;color:var(--dim);text-transform:uppercase}
.sum b{font-family:var(--display);font-size:22px;font-variant-numeric:tabular-nums}
.ups{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-bottom:14px}
.up{background:#232a35;border:1px solid var(--line);border-radius:8px;padding:10px;text-align:left;display:flex;flex-direction:column;gap:2px}
.up b{font-size:15px}
.up em{font-style:normal;font-size:12px;color:var(--dim)}
.up .c{font-family:var(--display);font-weight:800;color:var(--gold)}
.up:disabled{opacity:.45}
.lvl{font-size:11px;color:var(--good)}
.picks{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin-bottom:12px}
.pick{background:#232a35;border:2px solid var(--line);border-radius:10px;padding:6px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:2px}
.pick img{width:100%;height:120px;object-fit:cover;object-position:50% 0;border-radius:6px;background:#2d3440}
.pick b{font-size:14px}
.pick em{font-style:normal;font-size:11px;color:var(--dim);line-height:1.2}
.pick.on{border-color:var(--gold)}
.perk{font-size:13px;color:var(--text);background:#232a35;border-radius:8px;padding:8px 10px;margin:0 0 12px}
.team{display:flex;gap:6px;align-items:center}
.team img{width:28px;height:28px;object-fit:cover;object-position:50% 0;border-radius:50%;background:#2d3440;border:1px solid var(--line)}
@media (max-width:620px){.sum{grid-template-columns:repeat(2,1fr)}.ups{grid-template-columns:1fr}.brand{font-size:18px}.stat span{font-size:17px}.picks{grid-template-columns:repeat(3,1fr)}.pick img{height:90px}}
@media (max-height:480px){.panel{min-height:0;padding:6px 10px}.panel h3{font-size:15px;margin-bottom:3px}.app{gap:5px}.pick img{height:70px}}
@media not all and (orientation:portrait){.rot{display:none}}
@media (orientation:landscape) and (max-height:540px){
  .app{position:relative;padding:0;gap:0;max-width:none}
  .hud{position:absolute;top:0;left:0;right:0;z-index:3;padding:6px 12px 14px;gap:12px;flex-wrap:nowrap;background:linear-gradient(rgba(10,12,18,.88),rgba(10,12,18,0))}
  .brand,.rot{display:none}
  .stat small{font-size:9px}.stat span{font-size:16px}
  .btn{padding:5px 10px;font-size:12px}
  .stage{position:absolute;inset:0}
  svg.scene{border-radius:0}
  .panel{position:absolute;left:10px;right:10px;bottom:8px;z-index:3;background:rgba(27,32,41,.9);min-height:0;padding:6px 10px;max-height:46%;overflow:auto}
  .panel.idle{right:auto;max-width:60%}
  .panel.idle p{display:none}
  .panel h3{font-size:15px;margin-bottom:4px}
  .card{padding:5px 8px;min-width:112px}.card .p{font-size:15px}
}
@media (prefers-reduced-motion:reduce){.modal{backdrop-filter:none}}
</style>

// ---- sprites on the floor
function makeSprite(id,flip){
  const g=el('g',{},$('people'));
  const shadow=el('ellipse',{cx:0,cy:0,rx:30,ry:8,fill:'#000',opacity:.35},g);
  const ring=el('ellipse',{cx:0,cy:0,rx:40,ry:11,fill:'none',stroke:'#e9b949','stroke-width':4,opacity:0},g);
  const body=el('g',{},g);
  const img=el('image',{href:SPR[id].src,preserveAspectRatio:'none'},body);
  return {g,shadow,ring,body,img,ratio:SPR[id].r,flip:!!flip};
}

  o.img.setAttribute('width',w);o.img.setAttribute('height',h);o.img.setAttribute('x',-w/2);o.img.setAttribute('y',-h);
  o.body.setAttribute('transform',`translate(0 ${-(bob||0)}) rotate(${tilt||0})`+(o.flip?' scale(-1 1)':''));
  o.shadow.setAttribute('rx',w*.42);o.shadow.setAttribute('ry',h*.03+3);
  o.ring.setAttribute('rx',w*.55);o.ring.setAttribute('ry',h*.045+4);
  o.g.setAttribute('transform',`translate(${x} ${y})`);o.y=y;o.h=h;
}
function mover(id,spot){const o=makeSprite(id,false);o.x=spot[0];o.y=spot[1];o.tx=o.x;o.ty=o.y;o.path=[];o.home=spot;placeSprite(o,o.x,o.y);return o}
// ---- walking around the cars
const dist=(a,b)=>Math.hypot(a[0]-b[0],a[1]-b[1]);
const ADJ=NODES.map(()=>[]);EDGES.forEach(([a,b])=>{ADJ[a].push(b);ADJ[b].push(a)});
const nearest=pt=>{let bi=0,bd=1e9;NODES.forEach((n,i)=>{const d=dist(n,pt);if(d<bd){bd=d;bi=i}});return bi};
function route(from,to){
  const a=nearest(from),b=nearest(to);if(a===b)return[to];
  const D=NODES.map(()=>1e9),prev=NODES.map(()=>-1),done=new Set();D[a]=0;
  while(done.size<NODES.length){let u=-1;D.forEach((d,i)=>{if(!done.has(i)&&(u<0||d<D[u]))u=i});if(D[u]>=1e9)break;done.add(u);
    for(const v of ADJ[u]){const nd=D[u]+dist(NODES[u],NODES[v]);if(nd<D[v]){D[v]=nd;prev[v]=u}}}
  const p=[];for(let v=b;v>=0;v=prev[v])p.unshift(NODES[v]);
  while(p.length>=2&&dist(from,p[1])<dist(p[0],p[1]))p.shift();
  while(p.length>=2&&dist(p[p.length-2],to)<dist(p[p.length-2],p[p.length-1]))p.pop();
  return[...p,to];
}
function goTo(o,x,y){o.path=route([o.x,o.y],[x,y]);const n=o.path.shift();o.tx=n[0];o.ty=n[1]}
function arrived(o){return !o.path.length&&Math.hypot(o.tx-o.x,o.ty-o.y)<4}
function moveToward(o,dt,speed){
  let dx=o.tx-o.x,dy=o.ty-o.y,d=Math.hypot(dx,dy);
  if(d<=2&&o.path&&o.path.length){const n=o.path.shift();o.tx=n[0];o.ty=n[1];dx=o.tx-o.x;dy=o.ty-o.y;d=Math.hypot(dx,dy)}
  if(d>2){const s=Math.min(speed*dt,d);o.x+=dx/d*s;o.y+=dy/d*s;if(Math.abs(dx)>3)o.flip=dx<0;o.dist=(o.dist||0)+s}
  return d>2;
}
// a little step: bounce and sway, faster for small (far away) people
function stepPose(o,walking){if(!walking)return[0,0];const ph=(o.dist||0)/(hOf(o.y)*.22);return[Math.abs(Math.sin(ph))*hOf(o.y)*.03,Math.sin(ph)*2.2]}
// ---- cars you can walk behind
const cars=Object.keys(OCC).map((k,i)=>{const d=OCC[k];const g=el('image',{href:d.src,x:d.x,y:d.y,width:d.w,height:d.h,'pointer-events':'none'},$('people'));return{g,d,car:true,rank:i}});
function carCol(c,x,clamp){const d=c.d;let i=Math.floor((x-d.x)/5);if(i<0||i>=d.bot.length||d.bot[i]<0){if(!clamp)return -1;
  let best=-1,bd=1e9;d.bot.forEach((b,j)=>{if(b>=0&&Math.abs(j-i)<bd){bd=Math.abs(j-i);best=j}});return best}return i}
const behindCar=(o,c)=>{const i=carCol(c,o.x,true);return o.y<c.d.bot[i]-4};
const inCar=(x,y)=>cars.some(c=>{const i=carCol(c,x,false);if(i<0)return false;const b=c.d.bot[i],tp=c.d.top[i];return y<=b+10&&y>=tp+(b-tp)*.3});
function standSpot(p){const h=hOf(p.y);const pref=p.x<800?1:-1;
  for(const side of[pref,-pref]){const x=Math.max(120,Math.min(1540,p.x+side*h*.32)),y=Math.min(890,p.y+14);if(!inCar(x,y))return[x,y]}
  return[p.x,Math.min(890,p.y+h*.15)]}

const doorG=el('g',{},document.querySelector('svg.scene'));doorG.setAttribute('pointer-events','none');
const scn=document.querySelector('svg.scene');scn.insertBefore(doorG,$('people'));
const dcl=el('clipPath',{id:'dclip'},doorG);el('rect',{x:292,y:349,width:91,height:58},dcl);
const dpan=[0,1].map(i=>el('rect',{x:292+i*45.5,y:349,width:45.5,height:58,fill:'#e6eef6',stroke:'#cdd5de','stroke-width':2,'clip-path':'url(#dclip)',opacity:0},doorG));
let doorT=-1;function openDoor(){doorT=0}
function doorTick(dt){if(doorT<0)return;doorT+=dt;const o=doorT<.3?doorT/.3:doorT<1.2?1:doorT<1.6?1-(doorT-1.2)/.4:0;
  dpan[0].setAttribute('x',292-o*40);dpan[1].setAttribute('x',337.5+o*40);dpan.forEach(r=>r.setAttribute('opacity',doorT<1.6?.28:0));if(doorT>=1.6)doorT=-1}

let pid=0;
function freeSlot(){const used=new Set(people.filter(p=>p.slot>=0).map(p=>p.slot));for(let i=0;i<FLOOR.length;i++)if(!used.has(i))return i;return -1}
function freeChair(){const used=new Set(people.filter(p=>p.chair>=0).map(p=>p.chair));for(let i=0;i<Math.min(chairCap(),LOUNGE.length);i++)if(!used.has(i))return i;return -1}
function spawn(){
  const slot=freeSlot();if(slot<0)return;
  const service=Math.random()<.3;
  let want=null,budget=0;
  if(!service){const types=['sedan','suv','ev','sport'],w=[.35,.35,.18,.12];let r=Math.random(),ti=0;for(;ti<3&&r>w[ti];ti++)r-=w[ti];
    want=types[ti];const opts=MODELS.filter(m=>m.type===want);const base=opts[Math.random()*opts.length|0].price;
    budget=Math.round(base*(0.92+Math.random()*.35)/1000)*1000}
  const look=CUSTOMERS[Math.random()*CUSTOMERS.length|0];

  p.hit=el('rect',{fill:'transparent'},o.g);
  o.g.classList.add('person');
  o.g.addEventListener('pointerdown',e=>{e.preventDefault();select(p)});
  people.push(p);goTo(p,FLOOR[slot][0],FLOOR[slot][1]);o.g.style.opacity=0;openDoor();
}

function panelIdle(){$('panel').classList.add('idle');$('panel').innerHTML=`<h3>Day ${S.day} on the floor</h3><p>Tap a customer. Buyers show the kind of car and budget they want. Service customers need a seat in the lounge.</p>`}
function deselect(){if(sel)sel.ring.setAttribute('opacity',0);sel=null;if(player)goTo(player,HOME[0],HOME[1]);panelIdle()}
function select(p){
  if(mode!=='day'||p.state==='leave')return;
  $('panel').classList.remove('idle');
  if(sel&&sel!==p)sel.ring.setAttribute('opacity',0);

    return `<button class="card${ok?' match':''}" data-i="${i}"><b>${M.name}</b><em>${TYPE_LABEL[M.type]}</em><div class="p">${fmt(M.price)}</div></button>`}).join('');

function offer(p,i){
  const c=S.inv[i];if(!c)return;const M=MODELS.find(m=>m.id===c.m);
  let yes=false,msg='';
  if(M.type!==p.want){msg='Not what I came for.';p.pat-=.35}
  else if(M.price<=p.budget)yes=true;
  else if(M.price<=p.budget*1.1){yes=Math.random()<overBudgetYes();if(!yes){msg='A little over my budget…';p.pat-=.25}}
  else{msg='Way over my budget.';p.pat-=.3}

}

// ---- sounds
let ac=null;
function initAudio(){if(!ac){try{ac=new (window.AudioContext||window.webkitAudioContext)()}catch(e){}}if(ac&&ac.state==='suspended')ac.resume()}
function tone(f,d,v=.12,type='sine',at=0){if(!ac)return;const o=ac.createOscillator(),g=ac.createGain(),t0=ac.currentTime+at;o.type=type;o.frequency.value=f;g.gain.setValueAtTime(v,t0);g.gain.exponentialRampToValueAtTime(.001,t0+d);o.connect(g);g.connect(ac.destination);o.start(t0);o.stop(t0+d)}
function sfx(n){if(n==='sale'){tone(660,.15,.12,'triangle');tone(880,.2,.12,'triangle',.08);tone(1320,.3,.1,'triangle',.16)}else if(n==='ding')tone(1200,.18,.08);else if(n==='no')tone(220,.25,.1,'sawtooth');else if(n==='door')tone(520,.3,.05);else if(n==='level'){[523,659,784,1047].forEach((f,i)=>tone(f,.25,.12,'square',i*.09))}}

// ---- loop
function tick(ts){
  requestAnimationFrame(tick);const dt=Math.min(.05,(ts-(last||ts))/1000);last=ts;
  if(mode!=='day'||paused)return;
  t+=dt;$('timeBar').style.width=Math.min(100,t/DAY_LEN*100)+'%';
  spawnT-=dt;if(spawnT<=0&&t<DAY_LEN-8){spawn();sfx('door');spawnT=Math.max(2,(15-S.rating*.6-S.lv.ads*1.1)/pace())*(0.85+Math.random()*.3)}
  // player walks
  doorTick(dt);
  if(player){const m=moveToward(player,dt,300);placeSprite(player,player.x,player.y,...stepPose(player,m))}
  // hired staff close deals
  for(const s of staff){
    s.cool-=dt;
    if(s.cool<=0&&!s.target){const p=people.find(q=>!q.service&&q.state==='wait'&&q!==sel&&!q.claimed);
      if(p){const i=S.inv.findIndex(c=>{const M=MODELS.find(m=>m.id===c.m);return M.type===p.want&&M.price<=p.budget});
        if(i>=0){p.claimed=true;s.target=p;const sp=standSpot(p);goTo(s,sp[0],sp[1])}}
      if(!s.target)s.cool=3}
    if(s.target){const p=s.target;
      if(p.state!=='wait'){s.target=null;goTo(s,s.home[0],s.home[1]);s.cool=4}
      else if(arrived(s)){const i=S.inv.findIndex(c=>{const M=MODELS.find(m=>m.id===c.m);return M.type===p.want&&M.price<=p.budget});
        if(i>=0&&Math.random()<.8)sell(p,i,s);else{p.claimed=false;say(p,'Let me think…','#c3cad5')}
        s.target=null;goTo(s,s.home[0],s.home[1]);s.cool=(14+Math.random()*6)/pace()}}
    const m=moveToward(s,dt,260);placeSprite(s,s.x,s.y,...stepPose(s,m));
  }
  // customers
  for(const p of people.slice()){
    const walking=moveToward(p,dt,110*(0.8+0.2*pace()));
    if(!walking&&p.state==='walk')p.state=p.chair>=0?'seated':'wait';
    else if(!walking&&p.state==='leave'){if(!p.gone){p.gone=1;openDoor()}p.fade-=dt*2.5;p.g.style.opacity=Math.max(0,p.fade);if(p.fade<=0){removePerson(p);continue}}
    else if(p.fade<1){p.fade=Math.min(1,p.fade+dt*2.5);p.g.style.opacity=p.fade}
    placeSprite(p,p.x,p.y,...stepPose(p,walking));
    const h=hOf(p.y);p.bub.setAttribute('transform',`translate(0 ${-h-14})`);p.bub.style.display=p.state==='leave'?'none':'';
    p.hit.setAttribute('x',-h*.25);p.hit.setAttribute('y',-h-50);p.hit.setAttribute('width',h*.5);p.hit.setAttribute('height',h+50);
    if(p.state==='wait'||p.state==='seated')p.pat-=p.patRate*dt*patienceMul()*(p===sel?.6:1);
    if(p.state==='seated'){p.work+=dt;if(p.work>=serviceTime()){addCash(servicePay(),p.x,p.y-h-40,'SERVICE');dayStats.served++;rate(.05);sfx('sale');leave(p)}}
    if(p.pat<=0&&p.state!=='leave'){leave(p);dayStats.lost++;rate(-.15);say(p,"I'm leaving.",'#ff8a8a');sfx('no')}
    const pc=Math.max(0,p.pat);p.patBar.setAttribute('width',70*pc);p.patBar.setAttribute('fill',pc>.5?'#4cc38a':pc>.25?'#e9b949':'#e5484d');
  }
  // closer people are drawn in front
  sortT-=dt;if(sortT<=0){sortT=.1;let list=[...people,...staff,player].filter(Boolean).sort((a,b)=>a.y-b.y);
    for(const c of cars){let last=-1;list.forEach((o,i)=>{if(!o.car&&behindCar(o,c))last=i});
      const pre=list.slice(0,last+1),post=list.slice(last+1);
      list=[...pre.filter(o=>o.car||behindCar(o,c)),c,...pre.filter(o=>!o.car&&!behindCar(o,c)),...post]}
    list.forEach(o=>$('people').appendChild(o.g))}
  if(t>=DAY_LEN){people.filter(p=>p.state!=='seated'&&p.state!=='leave').forEach(leave);if(!people.length)endDay(false)}
}

// fill the stage: in wide layouts crop a little ceiling instead of showing empty bars
const scene=$('scene'),stageEl=document.querySelector('.stage');
function fit(){const r=stageEl.clientWidth/Math.max(1,stageEl.clientHeight);scene.setAttribute('preserveAspectRatio',r>1.9?'xMidYMax slice':'xMidYMid meet')}
addEventListener('resize',fit);addEventListener('orientationchange',()=>setTimeout(fit,200));fit();
$('buyBtn').onclick=openBuy;
$('pauseBtn').onclick=()=>togglePause();
document.addEventListener('visibilitychange',()=>{if(document.hidden&&mode==='day')togglePause(true)});
showIntro();requestAnimationFrame(tick);
})();
</script>
